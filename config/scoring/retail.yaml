# 소매 직구(낱개·소량 구매) 점수표 — 요청 파일에 sourcing_type: retail 일 때 사용.
# 시장 반응을 보려고 몇 개만 소비자 가격으로 사 보는 단계용입니다. 반응이 좋으면 small_batch → oem 순서로 넘어가세요.
# 가중치나 기준을 바꾸고 싶으면 이 파일만 수정하세요. (items 의 max 합계 = 100)
label: 소매 직구 (낱개·소량)

# 검색 단계에 추가로 전달되는 방향
discover_hint: |
  이번 소싱은 낱개~소량(max_order_qty 이하) 소매 구매입니다. 도매·공장이 아니라 지금 1개부터 살 수 있는 판매처를 찾으세요.
  - 대상: AliExpress 스토어(공식·브랜드 스토어 우선), Taobao·Tmall 스토어, 해외 쇼핑몰의 해외 배송 상품 등.
  - 상품 페이지 기준으로 찾으세요: 판매자(스토어)명, 상품 URL, 현재 판매가, 배송비, 판매량·후기 수·평점.
  - moq 에는 실제 최소 구매 수량(보통 1개)을, price_range 에는 낱개 판매가(+배송비)를 적으세요.
  - Taobao·Tmall 은 한국 직배송이 안 되는 판매자가 많아 구매대행·배송대행이 필요합니다. 그런 경우 notes 에 적으세요.
  - 같은 상품을 여러 판매자가 팔면 판매량·후기가 많은 곳을 우선하고, 지나치게 싼 곳은 가품 가능성을 notes 에 적으세요.

# 검증 단계에서 중점적으로 볼 것
verify_focus: |
  판매자(스토어) 평판과 운영 기간, 상품 후기의 실제 내용(품질 불만·불량률·실사진), 정품·디자인 도용 여부,
  한국 배송 가능 여부와 배송 기간·배송비, 구매자 보호(반품·환불) 조건을 중점 확인하세요.
  first_questions 에는 낱개 단가와 10개 이상 구매 시 할인, 한국 배송비·기간, 시험성적서(KC 인증용) 보유 여부,
  도매(소량 도매) 거래나 공장 연결이 가능한지를 포함하세요.

items:
  availability:
    label: 낱개 구매·재고
    max: 15
    guide: "1개부터 바로 구매 가능하고 재고 있음 확인 15점, 소량(요청 수량 이하) 가능 10점, 품절·옵션 제한 등 불확실 5점, 미확인 0점"
  price_fit:
    label: 단가 적합도
    max: 15
    guide: "배송비 포함 낱개 가격이 목표 단가 안 15점, 20% 이내 초과 8점, 크게 초과 또는 미확인 0점"
  seller_reputation:
    label: 판매자 평판
    max: 20
    guide: "스토어 평점·팔로워·판매량·분쟁 이력. 평점 4.7 이상이고 거래 다수 20점, 보통 10점, 신규·거래 적음 3점, 미확인 0점"
  product_reviews:
    label: 상품 후기·품질
    max: 15
    guide: "해당 상품 후기 수와 내용. 후기 다수이고 품질 불만 적음 15점, 후기 있으나 불만 일부 8점, 후기 거의 없음 3점, 미확인 0점"
  shipping_korea:
    label: 한국 배송
    max: 15
    guide: "한국 직배송 가능하고 배송 기간·배송비 확인 15점, 배송대행 필요하지만 경로 명확 8점, 미확인 0점"
  authenticity:
    label: 정품·디자인 적법성
    max: 10
    guide: "공식·브랜드 스토어이거나 자체 디자인으로 확인 10점, 일반 판매자이나 문제 징후 없음 5점, 가품·도용 의심 0점"
  years:
    label: 운영 기간
    max: 5
    guide: "스토어 운영 3년 이상 5점, 1~3년 3점, 1년 미만 1점, 확인 불가 0점"
  product_certs:
    label: 시험성적서
    max: 5
    guide: "요청 인증의 시험성적서·인증 표시가 확인되면 5점, 일부 2점, 없음/미확인 0점 (국내 판매 시 KC 인증 필요)"

risk_penalty:
  label: 리스크 감점
  min: -10
  guide: "가품·디자인 도용 의심, 사기 신고·분쟁, 비정상적 저가, 후기 조작 의심, 정보 불일치 등 발견 시 최대 -10점"

grades:          # 총점 기준 등급 (만점 100)
  A: 80
  B: 60
  C: 40          # 40 미만은 D
