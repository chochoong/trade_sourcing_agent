# OEM/ODM 공장 소싱 점수표 — 요청 파일에 sourcing_type: oem 일 때 사용 (기본값).
# 가중치나 기준을 바꾸고 싶으면 이 파일만 수정하세요. (items 의 max 합계 = 100)
label: OEM/ODM 공장 소싱

discover_hint: |
  이번 소싱은 OEM/ODM 맞춤 제작입니다.
  - 자체 공장을 보유한 제조사를 우선하고, 로고 인쇄·맞춤 사양 대응 여부를 확인하세요.
  - moq 에는 OEM 주문 기준 최소 수량을 적으세요.

verify_focus: |
  공장 보유·생산 능력, 요청 인증의 인증서, MOQ 협상 여지, 샘플 정책, OEM(로고·맞춤 사양) 대응 범위를 중점 확인하세요.

items:
  years:
    label: 업력
    max: 10
    guide: "5년 이상 10점, 2~5년 5점, 2년 미만 2점, 확인 불가 0점"
  company_type:
    label: 업체 유형
    max: 15
    guide: "직접 제조사(공장 보유 확인) 15점, 무역회사 7점, 불명 0점"
  platform_verification:
    label: 플랫폼 인증
    max: 15
    guide: "Verified/Assessed Supplier, Gold Supplier 연수, 현장 실사 여부에 따라 0~15점"
  product_certs:
    label: 제품 인증
    max: 15
    guide: "요청된 필수 인증을 모두 보유하고 증빙 확인 15점, 일부 보유 7점, 없음/미확인 0점"
  track_record:
    label: 거래 이력
    max: 10
    guide: "응답률, 재주문율, 후기 수, 수출(특히 한국) 실적에 따라 0~10점"
  cross_check:
    label: 외부 교차 확인
    max: 15
    guide: "홈페이지·주소·전화·기업정보(天眼查/企查查 등) 일치 여부에 따라 0~15점"
  moq_fit:
    label: MOQ 적합도
    max: 10
    guide: "요청 수량(max_order_qty 또는 moq 조건) 이하로 OEM 주문 가능 확인 10점, 공식 MOQ는 높지만 협상 가능 언급 5점, 초과 또는 미확인 0점"
  price_fit:
    label: 단가 적합도
    max: 10
    guide: "공개 단가가 목표 단가 범위 안 10점, 범위를 20% 이내로 벗어남 5점, 크게 벗어남 또는 미확인 0점"

risk_penalty:
  label: 리스크 감점
  min: -10
  guide: "사기 신고 이력, 비정상적 저가, 100% 선결제 요구, 정보 불일치 등 발견 시 최대 -10점"

grades:          # 총점 기준 등급 (만점 100)
  A: 80
  B: 60
  C: 40          # 40 미만은 D
