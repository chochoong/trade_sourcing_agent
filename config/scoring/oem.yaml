# 대량 사입·OEM 점수표 — 요청 파일에 sourcing_type: oem 일 때 사용 (기본값).
# 소량 사입으로 판매가 검증된 뒤, 공장·대형 도매와 직거래로 대량 구매(기성품) 또는 맞춤 제작(OEM/ODM)할 때.
# 가중치나 기준을 바꾸고 싶으면 이 파일만 수정하세요. (items 의 max 합계 = 100)
label: 대량 사입·OEM

discover_hint: |
  이번 소싱은 대량 사입·OEM 입니다. 판매가 검증된 품목을 공장·대형 도매와 직거래로 대량 구매합니다.
  - 맞춤 제작(로고·사양 변경)이 없어도 기성품을 대량으로 살 수 있는 제조사·대형 도매면 후보입니다.
    로고 인쇄·포장 변경·OEM/ODM 대응은 가능하면 확인해 notes 에 적으세요 (가점 요소, 필수 아님).
  - 자체 공장을 보유한 제조사를 우선하되, 재고를 직접 보유한 대형 도매·무역회사도 포함하세요.
  - moq 에는 기성품 대량 주문 기준 최소 수량을 적고, OEM MOQ 가 다르면 함께 적으세요 (예: "500 pcs / OEM 1,000 pcs").
  - price_range 에는 수량 구간별 단가(예: 500~999개, 1,000개 이상)를 공개된 만큼 적으세요.
  - 리드타임(생산·출고 기간), 샘플 가능 여부·비용, 수출 포장·해상/항공 출고 경험을 확인하세요.
  - 일본(preferred_countries 에 Japan)이면: 「OEM」「ODM」「OEM対応」 일본어 검색어로 제조사를 찾고,
    해외 거래(수출) 경험과 영어·한국어 대응 여부를 notes 에 적으세요.
  - 미국(preferred_countries 에 USA)이면: Thomasnet·제조사 홈페이지에서 미국 제조사를 찾고,
    수출 경험·소량 OEM 가능 여부를 notes 에 적으세요.

verify_focus: |
  공장 보유·생산 능력(대량 물량을 감당할 수 있는지), 요청 인증의 인증서(대량은 정식 수입신고라 인증 필수),
  MOQ·수량 구간 단가, 리드타임, 샘플 정책, 수출(특히 한국) 실적을 중점 확인하세요.
  OEM(로고·맞춤 사양) 대응은 가능 여부만 확인하면 됩니다 (가점).

items:
  years:
    label: 업력
    max: 10
    guide: "5년 이상 10점, 2~5년 5점, 2년 미만 2점, 확인 불가 0점"
  company_type:
    label: 업체 유형
    max: 15
    guide: "직접 제조사(공장 보유 확인) 15점, 재고를 직접 보유한 대형 도매·무역회사 10점, 단순 중개 무역회사 5점, 불명 0점"
  platform_verification:
    label: 플랫폼 인증
    max: 15
    guide: "Verified/Assessed Supplier, Gold Supplier 연수, 현장 실사 여부에 따라 0~15점"
  product_certs:
    label: 제품 인증
    max: 15
    guide: "요청된 필수 인증을 모두 보유하고 증빙 확인 15점, 일부 보유 7점, 없음/미확인 0점"
  track_record:
    label: 거래 이력
    max: 10
    guide: "응답률, 재주문율, 후기 수, 수출(특히 한국) 실적에 따라 0~8점. OEM/ODM(로고·포장·사양 변경) 대응이 확인되면 +2점 (최대 10점)"
  cross_check:
    label: 외부 교차 확인
    max: 15
    guide: "홈페이지·주소·전화·기업정보(天眼查/企查查 등) 일치 여부에 따라 0~15점"
  moq_fit:
    label: MOQ 적합도
    max: 10
    guide: "요청 수량(max_order_qty 또는 moq 조건, 없으면 1인 수입자의 첫 대량 주문으로 현실적인 수백~수천 개) 이하로 주문 가능하거나 혼합·분할 주문 가능 확인 10점, 공식 MOQ는 높지만 협상 가능 언급 5점, 초과 또는 미확인 0점"
  price_fit:
    label: 단가 적합도
    max: 10
    guide: "대량 구간 단가(수량별 가격표)가 목표 단가 범위 안 10점, 범위를 20% 이내로 벗어남 5점, 크게 벗어남 또는 미확인 0점"

risk_penalty:
  label: 리스크 감점
  min: -10
  guide: "사기 신고 이력, 비정상적 저가, 100% 선결제 요구, 정보 불일치 등 발견 시 최대 -10점"

grades:          # 총점 기준 등급 (만점 100)
  A: 80
  B: 60
  C: 40          # 40 미만은 D
