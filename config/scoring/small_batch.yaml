# 소량 도매(테스트 판매용) 점수표 — 요청 파일에 sourcing_type: small_batch 일 때 사용.
# 가중치나 기준을 바꾸고 싶으면 이 파일만 수정하세요. (items 의 max 합계 = 100)
label: 소량 도매 (테스트 판매)

# 소량 구매 단가 상한 (2번이 국내 판매가에서 역산하는 추정값 — 정확한 원가는 4번 원가·수익 계산)
#   상한(USD) = 국내 판매가 ÷ (1+부가세) × (1 − 판매 수수료 − 목표 마진) ÷ 환율 ÷ (1+관세) − 개당 운임
#   관세: products.duty_rate 가 없으면 duty_pct, 운임: products.est_shipping_usd 가 없으면 freight_usd (4번 config/hub.yaml 예비값과 같게)
price_ceiling:
  usd_krw: 1400
  vat_pct: 10
  fee_pct: 12          # 스마트스토어 등 판매 수수료 (결제 수수료 포함 대략)
  margin_pct: 25       # 남기고 싶은 마진
  duty_pct: 8
  freight_usd: 0.5

# 검색 단계에 추가로 전달되는 방향
discover_hint: |
  이번 소싱은 테스트 판매용 소량 구매입니다 (max_order_qty 이하).
  - 지금 바로 소량으로 살 수 있는 기성품(재고품) 판매자를 찾으세요:
    Alibaba 의 Ready to Ship / 저MOQ 상품, 1688 도매 스토어, AliExpress 도매·공식 스토어 등.
  - 맞춤 제작(OEM)이 필요한 공장보다 소량 구매가 바로 되는 곳을 우선하세요.
    단, 제조사가 직접 운영하는 스토어라면 나중에 OEM 전환이 쉬우니 notes 에 적으세요.
  - moq 에는 이 판매자에게서 실제로 살 수 있는 최소 수량을 적으세요.
  - 1688 판매자는 중국 내수용이라 보통 구매대행·배송대행이 필요합니다. 그런 경우 notes 에 적으세요.
  - 일본(preferred_countries 에 Japan)이면: 일본어 검색어로 NETSEA·SUPER DELIVERY 같은 도매몰, 제조사·도매상의
    「卸売」「業務用」「法人向け」 판매 페이지를 찾으세요. 일본 사업자만 거래하는 곳이 많으니
    해외(한국) 바이어 구매·해외 배송 가능 여부를 꼭 확인하고 trade_terms.ships_to_korea 에 적으세요.
    해외 발송(「海外発送」「海外配送」) 되는 도매몰·메이커를 우선하세요.
  - 미국(preferred_countries 에 USA)이면: 영문 검색어로 eBay 의 여러 개 묶음(lot)·도매 판매자, Amazon.com 판매자,
    미국 도매상·유통사(Thomasnet 등)를 찾으세요. 한국 배송 가능 여부와 수량 할인을 notes 에 적으세요.

# 검증 단계에서 중점적으로 볼 것
verify_focus: |
  판매자 평판(평점·후기·분쟁), 요청 수량 이하로 살 수 있는지, 재고·출고 기간, 한국 배송 방법,
  시험성적서(KC 인증 진행용) 제공 가능 여부, 나중에 OEM 으로 전환할 수 있는지(제조사 여부)를 중점 확인하세요.
  first_questions 에는 소량 단가, 첫 주문 배송비·배송 방법, 시험성적서 제공 여부,
  판매가 잘 될 경우 OEM(로고·한글 각인) 가능 수량을 포함하세요.

items:
  moq_fit:
    label: 소량 구매 가능
    max: 20
    guide: "요청 수량(max_order_qty) 이하로 바로 구매 가능 확인 20점, 혼합 주문·협상으로 가능 10점, 초과 또는 미확인 0점"
  price_fit:
    label: 단가 적합도
    max: 10
    guide: "소량 구매 단가가 target_price 의 '소량 구매 단가 상한' 이하 10점, 상한을 20% 이내로 초과 5점, 크게 초과 또는 미확인 0점. 상한이 없으면 목표 단가 범위 기준. '대량 FOB' 참고값은 수백 개 이상 기준이라 소량 단가와 직접 비교하지 말 것"
  seller_reputation:
    label: 판매자 평판
    max: 20
    guide: "플랫폼 평점·후기 수·거래 건수·응답률·분쟁 이력. 평점 4.5 이상이고 후기 다수 20점, 보통 10점, 후기 거의 없음 3점, 미확인 0점"
  years:
    label: 운영 기간
    max: 10
    guide: "판매자/스토어 운영 3년 이상 10점, 1~3년 5점, 1년 미만 2점, 확인 불가 0점"
  product_certs:
    label: 시험성적서
    max: 15
    guide: "요청된 인증의 시험성적서를 제공할 수 있음이 확인되면 15점(국내 KC 인증 진행에 필요), 일부 7점, 없음/미확인 0점"
  cross_check:
    label: 실체 확인
    max: 10
    guide: "기업정보·주소·홈페이지·연락처가 서로 일치하는지에 따라 0~10점"
  stock_shipping:
    label: 재고·배송
    max: 10
    guide: "재고 보유/Ready to Ship·출고 기간이 짧고 판매자가 한국으로 직접 발송(해외 직배송)하는 것이 확인되면 10점, 재고·출고는 확인됐지만 국내배송만이라 배송대행지가 필요하면 5점, 미확인 0점"
  oem_path:
    label: OEM 전환 가능성
    max: 5
    guide: "제조사이거나 공장과 직접 연결돼 있어 나중에 OEM(로고·각인) 전환이 가능 5점, 가능성 있음 2점, 순수 리셀러 또는 미확인 0점"

risk_penalty:
  label: 리스크 감점
  min: -10
  guide: "가품·디자인 도용 의심, 사기 신고·분쟁, 비정상적 저가, 정보 불일치 등 발견 시 최대 -10점"

grades:          # 총점 기준 등급 (만점 100)
  A: 80
  B: 60
  C: 40          # 40 미만은 D
